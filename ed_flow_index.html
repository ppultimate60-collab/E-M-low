<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ED Flow — Functional</title>
<style>
body{margin:0;background:#f4f7fb;font-family:Arial,sans-serif;color:#172033}.top{background:#111827;color:white;padding:16px 20px;font-size:20px;font-weight:700}.wrap{max-width:1200px;margin:auto;padding:18px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tabs button{padding:10px 14px;border:0;border-radius:9px;background:#fff;cursor:pointer}.tabs .on{background:#2563eb;color:#fff}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid #e4e8ef;border-radius:14px;padding:16px;margin-bottom:14px}.num{font-size:30px;font-weight:800}.muted{color:#667085;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}label{font-size:12px;font-weight:bold;color:#475467;display:block;margin-bottom:4px}input,select,textarea{width:100%;padding:10px;border:1px solid #d8dee9;border-radius:8px;box-sizing:border-box}textarea{min-height:80px}button{border:0;border-radius:8px;padding:10px 13px;font-weight:700;cursor:pointer}.primary{background:#2563eb;color:#fff}.secondary{background:#eef2f7}.red{color:#b91c1c;background:#fee2e2;padding:5px 8px;border-radius:7px}.urgent{color:#92400e;background:#fef3c7;padding:5px 8px;border-radius:7px}.stable{color:#065f46;background:#d1fae5;padding:5px 8px;border-radius:7px}.hidden{display:none}.patient{padding:12px;border:1px solid #e5e7eb;border-radius:10px;margin:7px 0;display:flex;justify-content:space-between;gap:10px}.flags{display:flex;flex-wrap:wrap;gap:7px}.flag{border:1px solid #ddd;padding:7px;border-radius:18px;cursor:pointer;font-size:12px}.flag.sel{background:#fee2e2;border-color:#fca5a5;color:#991b1b;font-weight:bold}.ai{background:#faf8ff;border:2px solid #c4b5fd}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}@media(max-width:800px){.cards,.grid{grid-template-columns:1fr 1fr}}@media(max-width:550px){.cards,.grid{grid-template-columns:1fr}.patient{display:block}}
</style></head>
<body><div class="top">🚑 ED Flow — Functional App</div><div class="wrap">
<div class="tabs"><button class="on" onclick="page('dash',this)">🏠 Dashboard</button><button onclick="page('new',this)">➕ New Patient</button><button onclick="page('patients',this)">📂 Previous Patients</button></div>

<section id="dash"><div class="card"><h2>Emergency Department Dashboard</h2><p class="muted">Live data from the local SQLite database.</p></div>
<div class="cards"><div class="card"><div class="muted">TOTAL</div><div class="num" id="total">0</div></div><div class="card"><div class="muted">RED</div><div class="num" id="red">0</div></div><div class="card"><div class="muted">URGENT</div><div class="num" id="urgent">0</div></div><div class="card"><div class="muted">STABLE</div><div class="num" id="stable">0</div></div></div>
<div class="card"><h3>Open Previous Patient Data</h3><div id="recent"></div></div></section>

<section id="new" class="hidden"><div class="card"><h2>New Emergency Patient</h2><div class="grid">
<div><label>Patient Code</label><input id="code" placeholder="Auto if blank"></div><div><label>Name / Identifier</label><input id="name"></div><div><label>Age</label><input id="age" type="number"></div><div><label>Sex</label><select id="sex"><option>Male</option><option>Female</option><option>Other</option></select></div><div><label>Patient Type</label><select id="type"><option>Trauma</option><option>Chest Pain / ACS</option><option>Asthma / COPD</option><option>Sepsis</option><option>Stroke</option><option>DKA / HHS</option><option>GI Bleed</option><option>Abdominal Pain</option><option>Toxicology</option><option>Seizure</option><option>Other</option></select></div><div><label>Chief Complaint</label><input id="cc"></div>
<div style="grid-column:1/-1"><label>History / HPI</label><textarea id="hist"></textarea></div><div style="grid-column:1/-1"><label>Examination</label><textarea id="exam"></textarea></div>
<div><label>HR</label><input id="hr" type="number" value="90"></div><div><label>SBP</label><input id="sbp" type="number" value="120"></div><div><label>RR</label><input id="rr" type="number" value="16"></div><div><label>SpO₂</label><input id="spo2" type="number" value="98"></div><div><label>Temp °C</label><input id="temp" type="number" step=".1" value="37"></div><div><label>GCS</label><input id="gcs" type="number" value="15"></div></div>
<h3 style="margin-top:18px">🚨 Red Flags</h3><div id="flags" class="flags"></div>
<div class="actions"><button class="primary" onclick="analyze()">🤖 Generate Provisional Diagnosis</button><button class="secondary" onclick="save()">💾 Save Patient</button></div></div>
<div id="ai" class="card ai hidden"></div></section>

<section id="patients" class="hidden"><div class="card"><h2>Previous Patient Data</h2><input id="search" placeholder="Search patient, code, type or complaint" oninput="loadPatients()"><div id="list"></div></div><div id="record"></div></section>
</div>
<script>
const flagMap={Trauma:["Airway threat","Massive bleeding","Tension pneumothorax","Shock","Reduced GCS","High-risk mechanism"],"Chest Pain / ACS":["Ongoing severe pain","ST elevation / ischemic ECG","Hypotension","Syncope","Arrhythmia","Acute heart failure"],"Asthma / COPD":["Silent chest","Unable to speak","Severe hypoxia","Exhaustion","Altered sensorium","Previous intubation/ICU"],Sepsis:["Hypotension","Altered mental status","Mottling","Oliguria","Severe hypoxia","Immunosuppression"],Stroke:["Sudden focal deficit","Reduced consciousness","Severe headache","Seizure","Anticoagulant use","Unclear last-known-well"],"DKA / HHS":["Hypotension","Kussmaul breathing","Altered sensorium","Severe dehydration","Arrhythmia","Vomiting"],"GI Bleed":["Shock","Massive hematemesis","Ongoing bleeding","Syncope","Melena + hypotension","Anticoagulant use"],"Abdominal Pain":["Peritonitis","Shock","GI bleed","Pregnancy possibility","Pain out of proportion","Pulsatile mass"],Toxicology:["Reduced GCS","Respiratory depression","Seizure","Arrhythmia","Hyperthermia","Unknown ingestion"],Seizure:["Status epilepticus","Persistent altered sensorium","Hypoglycemia","Fever/meningism","Head injury","Pregnancy/postpartum"],Other:["Airway threat","Severe breathing difficulty","Shock","Altered consciousness","Major bleeding","Seizure"]};
let selectedFlags=[];
function renderFlags(){let t=document.getElementById('type').value;selectedFlags=[];document.getElementById('flags').innerHTML=(flagMap[t]||flagMap.Other).map(f=>`<span class="flag" onclick="this.classList.toggle('sel');toggleFlag('${f}')">${f}</span>`).join('')}
document.getElementById('type').onchange=renderFlags;renderFlags();
function toggleFlag(f){selectedFlags.includes(f)?selectedFlags=selectedFlags.filter(x=>x!==f):selectedFlags.push(f)}
function news(){let rr=+v('rr'),sp=+v('spo2'),sbp=+v('sbp'),hr=+v('hr'),t=+v('temp'),g=+v('gcs'),s=0;s+=rr<=8?3:rr<=11?1:rr<=20?0:rr<=24?2:3;s+=sp<=91?3:sp<=93?2:sp<=95?1:0;s+=sbp<=90?3:sbp<=100?2:sbp<=110?1:sbp<=219?0:3;s+=hr<=40?3:hr<=50?1:hr<=90?0:hr<=110?1:hr<=130?2:3;s+=t<=35?3:t<=36?1:t<=38?0:t<=39?1:2;s+=g<15?3:0;return s}
function v(id){return document.getElementById(id).value}
function diagnosis(){let t=v('type');return t==='Chest Pain / ACS'?'Acute coronary syndrome':t==='Trauma'?'Major trauma / occult internal injury':t==='Asthma / COPD'?'Acute obstructive airway exacerbation':t==='Sepsis'?'Suspected sepsis / infection with organ dysfunction':t==='Stroke'?'Acute stroke syndrome':t==='DKA / HHS'?'Hyperglycemic emergency':t==='GI Bleed'?'Acute gastrointestinal hemorrhage':t==='Abdominal Pain'?'Acute abdomen — undifferentiated':t==='Toxicology'?'Acute poisoning / toxic syndrome':t==='Seizure'?'Acute seizure / possible status epilepticus':'Undifferentiated emergency presentation'}
function analyze(){let n=news(),risk=(selectedFlags.length||n>=7)?'RED':n>=5?'URGENT':'STABLE';document.getElementById('ai').classList.remove('hidden');document.getElementById('ai').innerHTML=`<h3>🤖 AI Provisional Assessment</h3><h2>${diagnosis()}</h2><p><b>NEWS2:</b> ${n} &nbsp; <span class="${risk.toLowerCase()}">${risk}</span></p><p><b>Red flags:</b> ${selectedFlags.length?selectedFlags.join(', '):'None selected'}</p><p><b>Next:</b> Repeat ABCDE, monitor deterioration, obtain pathway-appropriate investigations and use validated disease-specific scores. Senior clinician review is required.</p><small>Prototype clinical decision support only — not autonomous diagnosis or treatment.</small>`;window.last={n,risk,dx:diagnosis()}}
async function save(){if(!window.last)analyze();let payload={patient_code:v('code'),name:v('name'),age:v('age'),sex:v('sex'),patient_type:v('type'),chief_complaint:v('cc'),history:{hpi:v('hist')},examination:{exam:v('exam')},vitals:{HR:v('hr'),SBP:v('sbp'),RR:v('rr'),SpO2:v('spo2'),Temp:v('temp'),GCS:v('gcs')},red_flags:selectedFlags,news2:window.last.n,risk:window.last.risk,provisional_diagnosis:window.last.dx};let r=await fetch('/api/patients',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});alert((await r.json()).message);loadDash();loadPatients()}
async function loadDash(){let d=await (await fetch('/api/dashboard')).json();['total','red','urgent','stable'].forEach(k=>document.getElementById(k).textContent=d[k]);document.getElementById('recent').innerHTML=d.recent.length?d.recent.map(x=>`<div class="patient"><div><b>${x.patient_code}</b> — ${x.patient_type}<br><span class="muted">${x.provisional_diagnosis} • NEWS2 ${x.news2}</span></div><button class="secondary" onclick="openRecord(${x.id})">Open</button></div>`).join(''):'<p class="muted">No saved patients yet.</p>'}
async function loadPatients(){let q=encodeURIComponent(document.getElementById('search').value);let a=await(await fetch('/api/patients?q='+q)).json();document.getElementById('list').innerHTML=a.map(x=>`<div class="patient"><div><b>${x.patient_code}</b> ${x.name?'— '+x.name:''}<br>${x.patient_type} • ${x.provisional_diagnosis}<br><span class="muted">NEWS2 ${x.news2} • ${x.updated_at}</span></div><button class="secondary" onclick="openRecord(${x.id})">Open Full Data</button></div>`).join('')||'<p class="muted">No patients found.</p>'}
async function openRecord(id){let x=await(await fetch('/api/patients/'+id)).json();document.getElementById('record').innerHTML=`<div class="card ai"><h3>📄 Patient Record</h3><p><b>${x.patient_code}</b> • ${x.patient_type} • ${x.age||''} ${x.sex||''}</p><h2>${x.provisional_diagnosis}</h2><p>NEWS2: <b>${x.news2}</b> <span class="${x.risk.toLowerCase()}">${x.risk}</span></p><p><b>Chief complaint:</b> ${x.chief_complaint}</p><p><b>History:</b> ${x.history.hpi||''}</p><p><b>Examination:</b> ${x.examination.exam||''}</p><p><b>Vitals:</b> HR ${x.vitals.HR}, SBP ${x.vitals.SBP}, RR ${x.vitals.RR}, SpO₂ ${x.vitals.SpO2}, Temp ${x.vitals.Temp}, GCS ${x.vitals.GCS}</p><p><b>Red flags:</b> ${(x.red_flags||[]).join(', ')||'None'}</p><button class="secondary" onclick="document.getElementById('record').innerHTML=''">Close</button></div>`}
function page(id,btn){['dash','new','patients'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));btn.classList.add('on');if(id==='dash')loadDash();if(id==='patients')loadPatients()}
loadDash();
</script></body></html>
